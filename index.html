<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MH Policy Trainer</title>
  <meta name="description" content="Study the Philippine Mental Health Act (RA 11036), DOH AO 2016-0039 and DOH AO 2025-0028 with lessons, quizzes, flashcards and scenarios. Educational use only.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // Set the theme before first paint to avoid a flash. Storage can throw, so guard it.
    (function () {
      var t = null;
      try { t = localStorage.getItem('mhpt.theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

      <button id="btn-fwd" class="icon-btn" type="button" aria-label="Go forward" title="Forward" disabled>→</button>
      <a class="brand" href="#/"><img src="icons/icon-192.png" alt="" width="28" height="28"><span>MH Policy Trainer</span></a>
      <button id="btn-theme" class="icon-btn" type="button" aria-label="Switch theme" title="Light or dark mode">☾</button>
    </div>

      <a href="#/progress">Progress</a>
      <a href="#/about">About</a>
    </nav>
  </header>
  <main id="main" tabindex="-1"><p>Loading…</p></main>
  <footer><p id="foot-note"></p></footer>
  <noscript><p style="padding:1rem">This app needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
